<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tính năng đang phát triển</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }

    .develop-card {
      background: white;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      padding: 60px;
      text-align: center;
      max-width: 600px;
      width: 90%;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .icon {
      font-size: 80px;
      color: #007bff;
      margin-bottom: 20px;
    }

    h1 {
      font-weight: 700;
      color: #333;
    }

    p {
      color: #666;
      font-size: 1.1rem;
      margin-top: 10px;
    }

    .progress {
      height: 15px;
      border-radius: 10px;
      margin: 25px 0;
      background-color: #e9ecef;
    }

    .progress-bar {
      width: 65%;
      background: linear-gradient(90deg, #007bff, #00bcd4);
      animation: progressMove 2s ease-in-out infinite alternate;
    }

    @keyframes progressMove {
      0% { width: 60%; }
      100% { width: 90%; }
    }

    .btn-home {
      margin-top: 20px;
      border-radius: 20px;
      padding: 10px 25px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="develop-card">
    <div class="icon">
      <i class="fa-solid fa-screwdriver-wrench"></i>
    </div>
    <h1>Tính năng đang phát triển 🚧</h1>
    <p>Vì thời gian có hạn, chúng em chỉ thực hiện UC3: Đăng ký khoá học. Cảm ơn cô đã luôn quan tâm và yêu thương chúng emmm.</p>
    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated"></div>
    </div>
    <p class="text-muted">Vui lòng quay lại sau!</p>
    <a href="index.html" class="btn btn-primary btn-home">
      <i class="fa-solid fa-house me-2"></i> Quay về trang chủ
    </a>
  </div>

</body>
</html>
